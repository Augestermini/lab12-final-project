name: Deploy to Server

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy applications over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: 18.212.128.175
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: 22
          timeout: 30s
          command_timeout: 10m
          debug: true
          script: |
            set -e
            PROJECT_DIR="$HOME/lab12-final-project"
            REPOSITORY="https://github.com/${{ github.repository }}.git"

            if [ ! -d "$PROJECT_DIR/.git" ]; then
              git clone "$REPOSITORY" "$PROJECT_DIR"
            fi

            cd "$PROJECT_DIR"
            git pull origin main
            docker compose down
            docker compose up -d --build
            docker ps
